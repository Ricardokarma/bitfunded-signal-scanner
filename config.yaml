# Bitfunded Signal Scanner

A manual crypto signal dashboard for Bitfunded-style challenge trading.

## What it does

This app scans a curated list of major crypto pairs and uses a technical scoring model to flag high-probability opportunities for manual execution.

Features:
- Binance USD-M futures support via CCXT
- EMA, RSI, MACD, ADX, ATR, and volume checks
- Signal ranking with a score out of 100
- Simple risk sizing based on account size and risk percentage
- Manual trade checklist for Bitfunded discipline
- Configurable pairs and timeframes in `config.yaml`

## Run locally

1. Create a virtual environment
   ```bash
   python -m venv .venv
   source .venv/bin/activate
   ```

2. Install dependencies
   ```bash
   pip install -r requirements.txt
   ```

3. Launch the app
   ```bash
   streamlit run app.py
   ```

4. Open the browser to the local Streamlit URL shown in the terminal.

