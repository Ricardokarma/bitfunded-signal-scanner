# Bitfunded Signal Scanner Pro

A real-time crypto market scanner for Bitfunded-style challenge trading.

## What it does

This app scans a list of high-liquidity crypto pairs and ranks them using a model based on:
- EMA alignment
- RSI strength
- MACD momentum
- ADX trend confirmation
- ATR-based volatility
- volume confirmation
- funding rate and open interest checks
- BTC dominance snapshot from CoinGecko

It produces:
- Long / Short trade ideas
- Signal score (0–100)
- Confidence estimate
- Expected win-rate estimate
- Risk sizing estimate based on account size and risk percentage

## Startup

1. Create a virtual environment
   ```bash
   python -m venv .venv
   source .venv/bin/activate
   ```

2. Install dependencies
   ```bash
   pip install -r requirements.txt
   ```

3. Run the app
   ```bash
   streamlit run app.py
   ```

